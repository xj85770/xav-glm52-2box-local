# Full legitimate free / trial API catalog for the rolodex.
# Source: https://github.com/cheahjs/free-llm-api-resources (fetched 2026-07-25)
# context / tps_typical are best-known or estimated — see notes. Limits from the list.
# Do not abuse free tiers.

meta:
  source: https://github.com/cheahjs/free-llm-api-resources
  fetched: "2026-07-25"
  excludes: "reverse-engineered chatbots"

providers:
  - id: local
    name: Local GLM (two-box / ds4)
    tier: local
    privacy: private
    requires_env: null
    shared_quota: false
    notes: "Your Mac cluster. No cloud quota."
    models:
      - id: local/ds4
        display: GLM-5.2 via ds4-server
        litellm_model: openai/LOCAL_MODEL_ID
        api_base_env: LOCAL_DS4_BASE
        api_key_env: LOCAL_API_KEY
        context: 131072
        context_note: "served up to 128K in this repo; model trains higher"
        tps_typical: 3.0
        tps_note: "ds4 SSD streaming ~3 t/s Q4; TP/RPC higher"
        rpm: null
        rpd: null
        tpm: null
        tpd: null
        # Last-resort card on every lane so typing any lane always resolves.
        lanes: [local, fast, smart, code]
        order_in_lane: { local: 1, fast: 99, smart: 99, code: 99 }
      - id: local/llama
        display: GLM-5.2 via llama.cpp RPC
        litellm_model: openai/LOCAL_MODEL_ID
        api_base_env: LOCAL_LLAMA_BASE
        api_key_env: LOCAL_API_KEY
        context: 131072
        context_note: "served up to 128K"
        tps_typical: 18.5
        tps_note: "f16 KV + top-5 experts on 2× M5 Max"
        rpm: null
        rpd: null
        tpm: null
        tpd: null
        lanes: [local, fast, smart, code]
        order_in_lane: { local: 2, fast: 100, smart: 100, code: 100 }

